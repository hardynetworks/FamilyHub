<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FamilyHub</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b1020; color: #eef2ff;
         font-family: system-ui, "DejaVu Sans", sans-serif; text-align: center; user-select: none; padding: 24px; box-sizing: border-box; }
  img { width: 96px; height: 96px; }
  h1 { margin: 0; font-size: 34px; }
  #msg { font-size: 22px; font-weight: 600; margin: 0; }
  #detail { font-size: 16px; color: #a5b0cc; max-width: 640px; line-height: 1.5; margin: 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #818cf8; margin: 0 4px; animation: b 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s } .dot:nth-child(3) { animation-delay: .4s }
  @keyframes b { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  #settings { display: none; margin-top: 18px; font: inherit; font-size: 18px; font-weight: 650; color: #eef2ff; background: #1c2540;
              border: 1px solid #334066; border-radius: 14px; padding: 16px 26px; cursor: pointer; }
  #settings.show { display: inline-block; }
</style>
<script src="config.js"></script>
</head>
<body>
  <img src="icon.svg" alt="">
  <h1>FamilyHub</h1>
  <p id="msg">Starting…</p>
  <p id="detail"></p>
  <div id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <button id="settings" type="button">Screen settings</button>
<script>
  const cfg = window.FH || {};
  const url = (cfg.url || '').replace(/\/+$/, '');
  const setupUrl = cfg.setupUrl || 'http://127.0.0.1:8099/';
  const msg = document.getElementById('msg');
  const detail = document.getElementById('detail');
  const settings = document.getElementById('settings');
  settings.onclick = () => location.assign(setupUrl);

  // The on-screen setup (familyhub-setupd) starts with the device; wait for it for a little while.
  async function openSetup() {
    msg.textContent = url ? 'Opening screen settings…' : 'Setting up this screen…';
    for (let i = 0; i < 30; i++) {
      try {
        await fetch(setupUrl + 'api/state', { mode: 'no-cors', cache: 'no-store' });
        location.replace(setupUrl);
        return;
      } catch (e) {
        await new Promise((r) => setTimeout(r, 1000));
      }
    }
    msg.textContent = 'This screen isn’t connected to a FamilyHub yet.';
    detail.textContent = 'Connect a keyboard, press Ctrl+Alt+F2, sign in as “familyhub” and run: sudo familyhub-setup';
    document.getElementById('dots').remove();
  }

  if (!url || cfg.setup) {
    openSetup();
  } else {
    let tries = 0;
    const target = url + '/kiosk?os=1' + (cfg.code ? '&code=' + encodeURIComponent(cfg.code) : '');
    const check = async () => {
      try {
        // no-cors: we only need to know the server answers.
        await fetch(url + '/api/health', { mode: 'no-cors', cache: 'no-store' });
        msg.textContent = 'Opening FamilyHub…';
        location.replace(target);
      } catch (e) {
        tries++;
        msg.textContent = 'Waiting for the network…';
        detail.textContent = 'Trying to reach ' + url + (tries > 3 ? '. Check the network cable or Wi-Fi, or change the settings below.' : '');
        if (tries > 3) settings.classList.add('show');
        setTimeout(check, Math.min(15000, 2000 + tries * 1000));
      }
    };
    check();
  }
</script>
</body>
</html>
