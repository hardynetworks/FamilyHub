# ---- FamilyHub OS ----
set default=0
set timeout=10
menuentry "Install FamilyHub OS (kiosk) - ERASES this computer's disk" {
    linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg vga=788 --- quiet
    initrd /install.amd/initrd.gz
}
menuentry "Boot from the first hard disk (don't install)" {
    exit
}
# ---- Original Debian menu ----
