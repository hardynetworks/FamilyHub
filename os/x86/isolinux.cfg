path
prompt 0
timeout 100
default familyhub
say Installing FamilyHub OS in 10 seconds (this ERASES the disk). Turn the computer off now to cancel.
label familyhub
  kernel /install.amd/vmlinuz
  append auto=true priority=critical preseed/file=/cdrom/preseed.cfg vga=788 initrd=/install.amd/initrd.gz --- quiet
