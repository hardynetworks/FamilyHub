name: FamilyHub OS images

# Builds the kiosk images: Raspberry Pi (.img.xz), x86-64 USB installer (.iso) and the
# Windows kiosk setup (.zip). Run it from the Actions tab, or push a tag like os-v1.0.0
# to publish a GitHub release with the downloads attached.
on:
  workflow_dispatch:
  push:
    tags: ['os-v*']

permissions:
  contents: write

jobs:
  raspberry-pi:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Get pi-gen (64-bit)
        run: git clone --depth 1 --branch arm64 https://github.com/RPi-Distro/pi-gen.git pi-gen

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y $(awk -F: 'NF && $1 !~ /^#/ { print ($2 != "" ? $2 : $1) }' pi-gen/depends) qemu-user-static binfmt-support

      - name: Add the FamilyHub stage
        run: |
          cp os/pi/config pi-gen/config
          cp -r os/pi/stage-familyhub pi-gen/stage-familyhub
          mkdir -p pi-gen/stage-familyhub/00-install/files
          cp -r os/common pi-gen/stage-familyhub/00-install/files/common
          cp web/public/icon.svg pi-gen/stage-familyhub/00-install/files/common/files/usr/share/familyhub/icon.svg
          cp os/pi/familyhub.txt pi-gen/stage-familyhub/00-install/files/familyhub.txt
          rm -f pi-gen/stage2/EXPORT_IMAGE pi-gen/stage2/EXPORT_NOOBS
          chmod +x pi-gen/stage-familyhub/prerun.sh pi-gen/stage-familyhub/00-install/*.sh

      - name: Build the image
        run: cd pi-gen && sudo ./build.sh

      - name: Collect
        run: |
          mkdir -p out
          for f in pi-gen/deploy/*.img.xz; do cp "$f" "out/FamilyHubOS-RaspberryPi-arm64.img.xz"; done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyHubOS-RaspberryPi
          path: out/*.img.xz
          compression-level: 0

  x86-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xorriso

      - name: Download the Debian netinst ISO
        run: |
          BASE=https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/
          ISO=$(curl -fsSL "$BASE" | grep -oE 'debian-[0-9.]+-amd64-netinst\.iso' | head -n 1)
          echo "Using $ISO"
          curl -fsSL -o debian.iso "$BASE$ISO"
          curl -fsSL "${BASE}SHA256SUMS" | grep " $ISO\$" | sed "s| $ISO\$| debian.iso|" | sha256sum -c -

      - name: Build the FamilyHub OS installer ISO
        run: |
          mkdir -p build/familyhub
          cp -r os/common/. build/familyhub/
          cp web/public/icon.svg build/familyhub/files/usr/share/familyhub/icon.svg
          xorriso -osirrox on -indev debian.iso -extract /boot/grub/grub.cfg build/grub-debian.cfg
          cat os/x86/grub-familyhub.cfg build/grub-debian.cfg > build/grub.cfg
          mkdir -p out
          xorriso -indev debian.iso -outdev out/FamilyHubOS-x86_64.iso \
            -map os/x86/preseed.cfg /preseed.cfg \
            -map build/familyhub /familyhub \
            -map os/x86/isolinux.cfg /isolinux/isolinux.cfg \
            -map build/grub.cfg /boot/grub/grub.cfg \
            -boot_image any replay
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyHubOS-x86_64
          path: out/*.iso
          compression-level: 0

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          mkdir -p out/FamilyHub-Kiosk-Windows
          cp os/windows/* out/FamilyHub-Kiosk-Windows/
          cd out && zip -r FamilyHub-Kiosk-Windows.zip FamilyHub-Kiosk-Windows
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyHub-Kiosk-Windows
          path: out/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/os-v')
    needs: [raspberry-pi, x86-iso, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: FamilyHub OS ${{ github.ref_name }}
          files: dist/*
          body: |
            Kiosk images for FamilyHub screens. See os/README.md for install steps.
            - **FamilyHubOS-RaspberryPi-arm64.img.xz**: Raspberry Pi 3B+/4/5/Zero 2 W (flash with Raspberry Pi Imager or balenaEtcher)
            - **FamilyHubOS-x86_64.iso**: USB installer for x86-64 PCs (flash with balenaEtcher or Rufus; erases the PC's disk)
            - **FamilyHub-Kiosk-Windows.zip**: kiosk setup for an existing Windows PC
