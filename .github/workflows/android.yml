name: Android app

# Builds the FamilyHub Android app. With the signing secrets set (see android/README.md) it builds a
# signed release APK and a Play Store bundle (.aab); without them, a debug APK for testing.
# Push a tag like app-v1.0.0 to attach the files to a GitHub release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug APK only (see android/README.md)."
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ "$SIGNED" = "1" ]; then
            gradle --no-daemon assembleRelease bundleRelease
          else
            gradle --no-daemon assembleDebug
          fi
          mkdir -p ../out
          V="1.0.${GITHUB_RUN_NUMBER}"
          for f in app/build/outputs/apk/*/*.apk; do
            case "$f" in *debug*) cp "$f" "../out/FamilyHub-$V-debug.apk" ;; *) cp "$f" "../out/FamilyHub-$V.apk" ;; esac
          done
          cp app/build/outputs/bundle/release/*.aab "../out/FamilyHub-$V.aab" 2>/dev/null || true
          ls -lh ../out

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyHub-Android
          path: out/*

      - if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          name: FamilyHub for Android ${{ github.ref_name }}
          files: out/*.apk
          body: |
            Install **FamilyHub-*.apk** on your Android phone (allow "install unknown apps" once), open it and enter your FamilyHub address.
            See android/README.md for notifications and Google Play.
